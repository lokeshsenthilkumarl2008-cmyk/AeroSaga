<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AeroSaga Drone Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CesiumJS CSS -->
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    body, html, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #cesiumContainer {
      width: 100%;
      height: 100%;
    }
    #console {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      font-size: 12px;
      padding: 5px;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="console">Connecting to drone telemetry...</div>

  <!-- CesiumJS -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
  <script>
    // Initialize Cesium globe
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrainProvider: Cesium.createWorldTerrain()
    });

    // Example drone entity
    const drone = viewer.entities.add({
      name: "Drone-1",
      position: Cesium.Cartesian3.fromDegrees(77.5946, 12.9716, 100), // Bangalore coords
      point: { pixelSize: 10, color: Cesium.Color.YELLOW }
    });

    viewer.zoomTo(drone);

    // WebSocket connection to backend telemetry gateway
    const ws = new WebSocket("ws://localhost:8080/telemetry");

    ws.onopen = () => {
      document.getElementById("console").innerHTML += "<br/>Connected to telemetry server.";
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data); 
      // Expected format: { id: "Drone-1", lat: 12.97, lon: 77.59, alt: 120 }
      const entity = viewer.entities.getById(data.id);
      if (entity) {
        entity.position = Cesium.Cartesian3.fromDegrees(data.lon, data.lat, data.alt);
      }
      document.getElementById("console").innerHTML += `<br/>${data.id} → (${data.lat}, ${data.lon}, ${data.alt})`;
    };

    ws.onclose = () => {
      document.getElementById("console").innerHTML += "<br/>Telemetry connection closed.";
    };
  </script>
</body>
</html>
